<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skillingo - My Progress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3" aria-label="Main navigation"></nav>
    <main class="container py-5">
        <h1 class="fw-bold">My Learning Progress</h1>
        <p id="progress-message" class="text-secondary" role="status">Checking sign-in…</p>
        <div class="row g-3 my-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <p>Skills Completed</p>
                        <h2 id="completed-count">—</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <p>Skills In Progress</p>
                        <h2 id="started-count">—</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <p>Total Skills</p>
                        <h2 id="total-count">—</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h2 class="h4">Overall task progress: <span id="overall-percent">—</span></h2>
                <div class="progress" aria-hidden="true">
                    <div id="overall-bar" class="progress-bar bg-success" style="width: 0%"></div>
                </div>
            </div>
        </div>
        <h2 class="h3">Your Skills</h2>
        <div id="progress-list" class="row g-4 mt-2"></div>
        <template id="progress-template">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-4">
                        <h3 class="card-title h5"></h3>
                        <p class="skill-status fw-semibold"></p>
                        <p class="task-count text-secondary"></p>
                        <a href="#" class="btn btn-outline-dark rounded-pill"></a>
                    </div>
                </div>
            </div>
        </template>
    </main>
    <footer class="bg-white border-top py-4 mt-5">
        <div class="container text-center text-secondary"><small>Skillingo - Learn Skills. Build Confidence.</small>
        </div>
    </footer>
    <script type="module" src="./src/navbar.js"></script>
    <script type="module" src="./src/progress.js"></script>
</body>

</html>
