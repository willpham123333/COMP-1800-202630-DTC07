
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DTC07 - Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<main class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-sm p-4 w-100" style="max-width: 400px;">

        <h2 class="text-center mb-4">Create Account</h2>

        <form id="signup-form">

            <!-- Full Name -->
            <div class="mb-3">
                <label for="full-name" class="form-label">Full Name</label>
                <input type="text" id="full-name"
                       class="form-control" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email"
                       class="form-control" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password"
                       class="form-control" minlength="6" required>
            </div>

            <!-- Sign Up Button -->
            <button type="submit" class="btn btn-dark w-100">
                Sign Up
            </button>

            <p id="error-message" class="text-danger mt-3" role="alert"></p>

        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>

    </div>

</main>

<script type="module" src="./src/signup.js"></script>

</body>
</html>
