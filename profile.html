
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTC07 - Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3" aria-label="Main navigation"></nav>

    <!-- Profile -->
    <main class="container py-5">
        <div class="card border-0 shadow-sm mx-auto"
             style="max-width: 650px;">

            <div class="card-body p-4 text-center">

                <div class="bg-light rounded-circle mx-auto
                            d-flex align-items-center justify-content-center"
                     style="width: 90px; height: 90px;">
                    <span class="fs-1">👤</span>
                </div>

                <h3 class="mt-3" id="profile-name">Learner</h3>
                <p class="text-muted" id="profile-email">Loading...</p>

                <hr>

                <h5 class="mt-4">My Learning Progress</h5><p id="profile-message" role="status"></p>

                <div class="progress my-3">
                    <div id="profile-bar" class="progress-bar bg-dark"
                         style="width: 0%">0%</div>
                </div>

                <div class="row mt-4">
                    <div class="col-6">
                        <h4 id="profile-completed">—</h4>
                        <p class="text-muted">Skills Completed</p>
                    </div>

                    <div class="col-6">
                        <h4 id="profile-started">—</h4>
                        <p class="text-muted">In Progress</p>
                    </div>
                </div>

                <hr>

                <a href="skill.html"
                   class="btn btn-dark rounded-pill px-4 mt-3">
                    Explore Skills
                </a>

            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->

    <!-- Firebase JS -->
    <script type="module" src="./src/profile.js"></script>
    <script type="module" src="./src/navbar.js"></script>

</body>
</html>
