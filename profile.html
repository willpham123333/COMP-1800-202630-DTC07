
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTC07 - Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">DTC07</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <div class="navbar-nav ms-auto gap-2">
                    <a class="btn btn-light rounded-pill" href="index.html">Home</a>
                    <a class="btn btn-light rounded-pill" href="skill.html">Skill</a>
                    <a class="btn btn-light rounded-pill" href="progress.html">Progress</a>
                    <a class="btn btn-light rounded-pill" href="profile.html">Profile</a>
                    <a id="auth-button" class="btn btn-dark rounded-pill px-4"
                       href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Profile -->
    <main class="container py-5">
        <div class="card border-0 shadow-sm mx-auto"
             style="max-width: 650px;">

            <div class="card-body p-4 text-center">

                <div class="bg-light rounded-circle mx-auto
                            d-flex align-items-center justify-content-center"
                     style="width: 90px; height: 90px;">
                    <span class="fs-1">👤</span>
                </div>

                <h3 class="mt-3" id="profile-name">Learner</h3>
                <p class="text-muted" id="profile-email">Loading...</p>

                <hr>

                <h5 class="mt-4">My Learning Progress</h5>

                <div class="progress my-3">
                    <div class="progress-bar bg-dark"
                         style="width: 0%">0%</div>
                </div>

                <div class="row mt-4">
                    <div class="col-6">
                        <h4>0</h4>
                        <p class="text-muted">Skills Completed</p>
                    </div>

                    <div class="col-6">
                        <h4>0</h4>
                        <p class="text-muted">In Progress</p>
                    </div>
                </div>

                <hr>

                <a href="skill.html"
                   class="btn btn-dark rounded-pill px-4 mt-3">
                    Explore Skills
                </a>

            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase JS -->
    <script type="module" src="./src/profile.js"></script>
    <script type="module" src="./src/navbar.js"></script>

</body>
</html>
