<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skillingo - Skills</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3" aria-label="Main navigation"></nav>
    <main class="container py-5">
        <h1 class="fw-bold">Explore Skills</h1>
        <p id="skills-message" class="text-secondary" role="status">Checking sign-in…</p>
        <div id="skills-list" class="row g-4 mt-2"></div>
        <template id="skill-template">
            <div class="col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-4">
                        <h2 class="card-title h4"></h2>
                        <p class="card-text text-secondary"></p>
                        <p class="task-count small text-secondary"></p>
                        <a class="btn btn-dark rounded-pill" href="#">Start / Resume Skill</a>
                    </div>
                </div>
            </div>
        </template>
    </main>
    <footer class="bg-white border-top py-4 mt-5">
        <div class="container text-center text-secondary"><small>Skillingo - Learn Skills. Build Confidence.</small>
        </div>
    </footer>
    <script type="module" src="./src/navbar.js"></script>
    <script type="module" src="./src/skills.js"></script>
</body>

</html>
