<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skillingo - Learn a Skill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3" aria-label="Main navigation"></nav>
    <main class="container py-5">
        <a href="skill.html" class="text-secondary">Back to Skills</a>
        <h1 id="lesson-name" class="fw-bold mt-3">Your skill</h1>
        <p id="lesson-description" class="text-secondary"></p>
        <p id="lesson-message" role="status">Checking sign-in…</p>
        <p id="lesson-progress" class="fw-semibold"></p>
        <div class="progress mb-4" aria-hidden="true"><div id="lesson-bar" class="progress-bar bg-success" style="width: 0%"></div></div>
        <div id="task-list" class="row g-3"></div>
        <template id="task-template">
            <div class="col-12"><div class="card border-0 shadow-sm"><div class="card-body p-4">
                <h2 class="task-title h5 mb-3"></h2>
                <button class="btn btn-dark rounded-pill" type="button">Complete task</button>
            </div></div></div>
        </template>
        <a href="progress.html" class="btn btn-outline-dark rounded-pill mt-4">View My Progress</a>
    </main>
    <footer class="bg-white border-top py-4 mt-5">
        <div class="container text-center text-secondary"><small>Skillingo - Learn Skills. Build Confidence.</small></div>
    </footer>
    <script type="module" src="./src/navbar.js"></script>
    <script type="module" src="./src/lesson.js"></script>
</body>
</html>
